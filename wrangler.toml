name = "scanlake-auth"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# Served on the parent domain's subdomain so the session cookie (Domain=scanlake.rocks)
# reaches every *.scanlake.rocks app.
routes = [
  { pattern = "auth.scanlake.rocks", custom_domain = true }
]

[vars]
# OAuth2 client ID from the Discord Developer Portal (not a secret).
DISCORD_CLIENT_ID = "1565351473255030895"
# Public base URL of this worker; Discord redirects to ${PUBLIC_URL}/callback.
PUBLIC_URL = "https://auth.scanlake.rocks"
# The session cookie is set on this domain so all subdomains share the login.
# Empty = host-only cookie (local dev on localhost).
COOKIE_DOMAIN = "scanlake.rocks"
# "true" also accepts http://localhost origins. Local dev only (.dev.vars).
ALLOW_LOCALHOST = "false"
# Discord IDs (comma-separated) that may use /api/admin/* (the Dashboard's /ADMIN tab). Not secret.
ADMIN_DISCORD_IDS = "374907224469798922"
# Analytics Engine dataset ScanLake Gateway writes its per-key request counts to.
USAGE_DATASET = "scanlake_gateway_usage"

# DISCORD_CLIENT_SECRET must be set as a secret:
#   npx wrangler secret put DISCORD_CLIENT_SECRET

[[d1_databases]]
binding = "AUTH_DB"
database_name = "scanlake-auth"
# Replace with the id printed by: npx wrangler d1 create scanlake-auth
database_id = "d41e1a13-1951-429c-8d5e-f51f799d6544"
migrations_dir = "migrations"

# Desktop login: 20 requests per minute per key (code exchange per IP, code issuing per account).
# namespace_id is any account-unique number; nothing has to be created for it.
[[ratelimits]]
name = "DESKTOP_RATE_LIMIT"
namespace_id = "2401"
simple = { limit = 20, period = 60 }

# Creating and revoking Gateway API keys: 5 per minute per account.
[[ratelimits]]
name = "API_KEY_RATE_LIMIT"
namespace_id = "2405"
simple = { limit = 5, period = 60 }

# Gateway API keys, shared with ScanLake Gateway (and Store, which only reads `apikey:*`).
# Auth writes `ukey:<sha256>` for keys users create and the `config:user-keys` switch.
[[kv_namespaces]]
binding = "API_KEYS"
id = "ac8fe738c3014c49b0a986af12af23f9"
preview_id = "b7c163bedd4644e8bd010e4d57252ca1"

# Reads the Gateway's usage counts (Analytics Engine) for the admin panel. Always remote:
# `wrangler dev` queries the real account (needs `wrangler login`); tests never call it.
[analytics]
binding = "ANALYTICS_SQL"
remote = true

# Daily cleanup of expired sessions and desktop login codes.
[triggers]
crons = ["17 3 * * *"]

# Local dev port; 8787 (wrangler's default) is taken by ScanLake Store's dev server.
[dev]
port = 8788
